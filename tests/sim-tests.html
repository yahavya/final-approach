<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Model Checks</title>
<style>
  :root { --bg: #fff; --ink: #1c1f24; --dim: #667; --ok: #137a3a; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --ink: #e8e6e1; --dim: #99a; --ok: #6fd694; --bad: #ff8a80; } }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, sans-serif; margin: 0 auto; padding: 24px 16px; max-width: 760px; }
  li { list-style: none; padding: 3px 0; }
  ul { padding: 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); font-weight: 600; } small { color: var(--dim); }
</style>
</head>
<body>
<h1 id="sum">Running...</h1>
<ul id="list"></ul>
<script type="module">
  import { allTests } from './sim-tests.js';
  const results = allTests();
  const failed = results.filter((r) => !r.pass).length;
  document.getElementById('sum').textContent = `${results.length - failed} of ${results.length} passed`;
  const list = document.getElementById('list');
  for (const r of results) {
    const li = document.createElement('li');
    const mark = document.createElement('span');
    mark.className = r.pass ? 'ok' : 'bad';
    mark.textContent = r.pass ? 'PASS  ' : 'FAIL  ';
    const detail = document.createElement('small');
    detail.textContent = r.detail ? `  ${r.detail}` : '';
    li.append(mark, r.name, detail);
    list.append(li);
  }
</script>
</body>
</html>
